  <rect x="360" y="245" width="500" height="245" rx="14" fill="url(#screen)"/>
  <rect x="372" y="260" width="82" height="10" rx="5" fill="#293a4b"/>
  <circle cx="385" cy="265" r="5" fill="#89f7cc"/>
  <circle cx="405" cy="265" r="5" fill="#4f8cff"/>
  <circle cx="425" cy="265" r="5" fill="#ff5b7c"/>
