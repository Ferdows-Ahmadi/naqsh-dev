  <rect x="415" y="336" width="180" height="8" rx="4" fill="#4f8cff"/>
  <rect x="415" y="362" width="300" height="8" rx="4" fill="#53677d"/>
  <rect x="415" y="388" width="220" height="8" rx="4" fill="#8d7cff"/>
  <rect x="415" y="414" width="275" height="8" rx="4" fill="#00ff88" opacity=".62"/>
  <rect x="705" y="320" width="105" height="105" rx="18" fill="#142235" stroke="#28415b"/>
  <text x="732" y="384" fill="#8aa0ba" font-family="Consolas, monospace" font-size="42">&lt;/&gt;</text>
  <path d="M260 525h700l70 55H190z" fill="#1a2430"/>
  <path d="M330 528h560l45 28H285z" fill="#2a3442" opacity=".75"/>
  <g fill="none" stroke="#6c86a4" stroke-width="3" opacity=".75">
    <rect x="150" y="115" width="170" height="96" rx="12"/>
    <circle cx="650" cy="115" r="64"/>
    <path d="M586 115h128M650 51c28 34 28 94 0 128M650 51c-28 34-28 94 0 128"/>
